[package]
name = "voxelgame"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build]
rustflags = ["-Z", "threads=14"]

[dependencies]
bytemuck = {version="1.14.0", features=["derive"]}
nalgebra = {version="0.33.0", features=["bytemuck"]}
ndarray = "0.15.6"
pollster = "0.3"
rand = "0.8.5"
simba = "0.8.1"
wgpu = { version = "22.0.0", features = ["spirv"] }
bevy_ecs = "0.13.2"
bevy_derive = "0.13.2"
winit = {version="0.30.1", features=["serde"]}
block-mesh = "0.2.0"
rustc-hash = "2.0.0"
simdnoise = { git = "https://github.com/valadaptive/rust-simd-noise", rev = "965175f" }

[build-dependencies]
spirv-builder = { git = "https://github.com/Rust-GPU/rust-gpu", rev = "9a533a3" }

# Compile build-dependencies in release mode with
# the same settings as regular dependencies.
[profile.release.build-override]
opt-level = 3
codegen-units = 16
[profile.dev.build-override]
opt-level = 3
